user=dnsmasq
group=dnsmasq
interface=*
address=/#/10.10.10.3
# Per-domain overrides for allowed destinations (e.g. PyPI), generated by run-sandbox.sh. A domain-specific `server=` line here
# takes precedence over the `address=/#/...` wildcard above, so only queries for these specific domains get forwarded to Podman's
# DNS forwarder, that in turn forwards it to the resolver configured on the host.
conf-dir=/etc/dnsmasq.d/,*.conf
